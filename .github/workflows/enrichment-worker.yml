name: Enrichment Worker (continuous backlog, batched)

# Runs scripts/enrichment-worker.js in --once mode on a schedule, since a
# TRULY continuous process can't live on GitHub Actions (every job is a
# fresh VM that's destroyed when it exits — there's no "stays running"
# option here). Running --once every few hours is the closest approximation
# GitHub Actions can offer without a real always-on host.
#
# This exists because GCP e2-micro billing verification failed twice
# (error OR_BACR2_31 — a card rejection, not a balance issue) and Hetzner
# was explicitly declined — see memory.md's enrichment-worker entry. Rather
# than block on resolving hosting, this wires the same already-built,
# already-verified worker into the one piece of infrastructure that's
# already working: the existing GitHub Actions setup.
#
# Real cost, stated up front rather than glossed over (see memory.md's
# runtime-scoping entry for the same discipline applied here): the account
# was already over its free 2,000 min/month before this workflow existed
# (~2,110 min/month steady-state from the other 5 workflows).
#
# 2026-09-09, raised from 75x4/day to 150x8/day to drain the backlog. Cost
# recomputed rather than left stale: measured runtime was ~1m47s for a batch
# of 10; a batch of 150 is dominated by per-lead crawling, so budget ~8-12
# min/run. At 8 runs/day x 30 days that is ~2,400 min/month, taking the
# account to roughly ~4,500/month — about $20/month in Actions overage at
# the post-Jan-2026 $0.008/min rate, up from the ~$10-11 the 6-hourly
# schedule cost. Deliberate trade: ~9 days to clear the buyer backlog
# instead of ~37. Drop the cron back to */6 once it is drained.

on:
  schedule:
    # Every 3 hours at :07 (off the hour — every cron on the planet fires at
    # :00). Raised from every 6h alongside the batch size below to drain the
    # pre-31-Aug backlog: 16,264 leads had a website but no named contact,
    # 11,182 of them buyers. At the old 75x4/day it was a 37-day drain for
    # buyers alone; at 150x8/day it's ~9 days. Real measured runtime is under
    # 2 minutes for a batch of 10 against a 25-minute timeout, so the headroom
    # for a larger batch is genuinely there — but re-check the timeout if the
    # batch is ever raised much beyond 150.
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Leads per run'
        default: '150'

# Prevents two runs overlapping if one is still going when the next cron
# fires (a slow scrapegraph/LLM rung could plausibly run past 6 hours in a
# bad case) — an overlapping run would double-process the same batch since
# last_enrichment_attempt_at only gets written at the END of a run.
concurrency:
  group: enrichment-worker
  cancel-in-progress: false

permissions:
  contents: read   # this workflow only writes to Supabase, never commits to the repo

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # generous vs. the ~5-10 min a 75-lead batch actually took in local testing

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        # Found missing after fixing the GROQ_KEY_1 auth error: a
        # dead key had been failing scrapegraph's very first request for
        # weeks, which meant this workflow never actually got far enough
        # to hit ScrapegraphAI's own Playwright-launched browser and
        # discover it was never installed here either (the other two
        # scrape workflows have this step; this one never did).
        run: npx playwright install chromium --with-deps

      - name: Install Python deps (ScrapegraphAI — email enrichment rung 2)
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai langchain-openai --quiet

      - name: Install Playwright's browser for the PYTHON package specifically
        # Round two of the same bug: the Node install above satisfies
        # Node's own playwright/playwright-core (package.json), but
        # ScrapegraphAI actually launches a browser through pip's separate
        # `playwright` package, which pins its own browser build revision
        # (confirmed live: the error asked for a `chromium_headless_shell`
        # revision the Node-side install never fetched). Python's own
        # playwright CLI has to run its own install for its own pinned
        # revision -- the two packages don't share a satisfied cache entry
        # just because they happen to write into the same directory tree.
        run: python -m playwright install --with-deps chromium

      - name: Run enrichment worker (one batch)
        run: node scripts/enrichment-worker.js --once --batch-size=${{ github.event.inputs.batch_size || '150' }}
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
