name: LLM Classification (Layer 3)

on:
  schedule:
    # Was daily; switched to weekly at the user's explicit request. Saturday,
    # after all three scrape workflows have run for the week (Sun/Wed/Fri),
    # so this sweeps up whatever rules+web tagging left unclassified from
    # everything scraped that week in one pass rather than several partial
    # ones.
    - cron: '0 4 * * 6'   # 09:00 PKT every Saturday
  workflow_dispatch:        # manual trigger, with optional dry-run/force inputs
    inputs:
      dry_run:
        description: 'Dry run (log candidates, make no API calls or writes)'
        required: false
        default: 'false'
      force:
        description: 'Force re-classify everything (ignores confidence threshold)'
        required: false
        default: 'false'

permissions:
  contents: read   # writes go to Supabase only, nothing is committed

jobs:
  classify:
    runs-on: ubuntu-latest
    # Was 60, sized for Groq's throughput at concurrency 3. config.json's
    # llmClassification now defaults to provider "cloudflare" at concurrency 1
    # (deliberate — see commit e8cdea8: concurrency > 1 was tripping
    # Cloudflare's per-minute limit), which is genuinely slower per lead. The
    # 2026-08-19 run hit exactly this: passed unit tests fine, then ran the
    # full 1000-lead cap sequentially and got killed by the 60-minute ceiling
    # mid-batch — "The job has exceeded the maximum execution time of 1h0m0s".
    # Nothing was lost (each lead's Supabase write happens incrementally, not
    # buffered to the end — see runLlmClassification.js), but the run wasted
    # an hour of CI time without finishing. 150 gives real margin over the
    # ~45-90 min a full 1000-lead run actually takes at concurrency 1.
    timeout-minutes: 150

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Layer 3 classification
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node src/index.js classify $ARGS
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Alternative free classification providers — each is inert unless
          # config.json selects it via llmClassification.provider.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
