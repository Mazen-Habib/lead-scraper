name: Weekly Lead Scrape

on:
  schedule:
    - cron: '0 19 * * 0'   # midnight PKT (UTC+5) every Sunday
  workflow_dispatch:        # manual trigger from GitHub UI anytime

permissions:
  contents: write           # needed to commit CSVs back to repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6h cap — expanded run (106 GM + 47 Clutch + 21 GF + 16 Sortlist + 26 DR + 35 GH + 8 TD + 12 TechBehemoths + 13 SelectedFirms + Eventbrite + PSEB)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        # Genuinely hung this exact step for an entire job budget on 2026-08-19
        # (personalized-scrape.yml's run, same install line): apt-get stalled
        # fetching a package index from an Ubuntu mirror with no forward
        # progress for 90 minutes straight, no error, nothing to retry against
        # because there was no per-attempt timeout to fail it. `timeout 300`
        # bounds each attempt so a stuck mirror gets retried instead of eating
        # the whole job; the step-level timeout-minutes is the outer backstop.
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium --with-deps && break
            echo "Playwright/Chromium install attempt $i/3 failed or hung, retrying in 15s..."
            sleep 15
          done

      - name: Install Python deps (ScrapegraphAI)
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai langchain-openai --quiet

      - name: Install Python deps (Scrapling)
        run: pip install "scrapling[fetchers]" --quiet && scrapling install

      - name: Install Python deps (MarkItDown — web-tagging fallback rung)
        run: pip install "markitdown[all]" --quiet

      - name: Install curl-impersonate (TLS-fingerprint fallback for emailFinder)
        # Best-effort: this step never fails the job. Resolves the actual
        # latest release asset via the GitHub API rather than a hardcoded
        # version/filename, since lwthiker/curl-impersonate's version and
        # naming can change. If anything here breaks, curlImpersonate.js
        # probes for the binary at runtime and just disables itself when
        # it's absent — exactly the same as running on a machine that never
        # had this step.
        continue-on-error: true
        run: |
          ASSET_URL=$(curl -sL https://api.github.com/repos/lwthiker/curl-impersonate/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*x86_64-linux-gnu\.tar\.gz"' \
            | grep -v 'lib' | head -1 | cut -d'"' -f4)
          echo "Resolved asset: ${ASSET_URL:-<none found>}"
          curl -sL "$ASSET_URL" -o curl-impersonate.tar.gz \
            && mkdir -p curl-impersonate && tar -xzf curl-impersonate.tar.gz -C curl-impersonate \
            && sudo cp curl-impersonate/curl_chrome* /usr/local/bin/curl_chrome116 \
            && sudo chmod +x /usr/local/bin/curl_chrome116 \
            && curl_chrome116 --version || echo "curl-impersonate install skipped/failed — fallback stays disabled, no impact on the run"

      - name: Run unit tests
        run: npm test

      - name: Verify shared taxonomy/regions data is in sync with the dashboard
        run: npm run sync-shared-data:check

      - name: Run scraper (tech verticals only)
        # Explicit --only list, NOT a bare `node src/index.js`. A bare run
        # scrapes every enabled source in SOURCE_REGISTRY, which since
        # weekly-scrape-general.yml was added has silently included
        # googleMapsGeneral and openStreetMap — the two sources that workflow
        # exists to own. They were being scraped TWICE a week (here on Sunday,
        # again on Wednesday), producing duplicate leads that dedupe() then
        # throws away.
        #
        # Measured on the 2026-08-23 run that hit the 6h ceiling and was
        # cancelled mid-scrape (nothing synced, nothing committed):
        #   Google Maps (general)  115.7 min   <- belongs to Wednesday
        #   Google Maps (tech)      83.6 min
        #   OpenStreetMap (x3)      20.8 min   <- belongs to Wednesday
        #   everything else         ~47 min
        # Removing the two Wednesday-owned sources cuts ~136 min of pure
        # duplicate work off this job, taking it from >360 min to ~140.
        #
        # Keep this list in sync with src/sources/index.js's SOURCE_REGISTRY:
        # it is every key EXCEPT googleMapsGeneral + openStreetMap (Wednesday's)
        # and openCorporates (disabled in config.json — its free tier requires
        # open-licensing the data, incompatible with private lead data).
        run: node src/index.js --only=googleMaps,githubOrgs,pseb,topDevelopers,eventbrite,clutch,goodFirms,sortlist,designRush,techBehemoths,selectedFirms
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Export the complete, guaranteed-up-to-date leads database
        run: npm run export-all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updated lead files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No new leads — nothing to commit."
          else
            TOTAL=$(wc -l < output/leads-master.csv || echo "?")
            RUN_CSV=$(ls -t output/runs/*.csv 2>/dev/null | head -1)
            RUN_TOTAL=$([ -n "$RUN_CSV" ] && wc -l < "$RUN_CSV" || echo "?")
            echo "Run scraped: ${RUN_TOTAL} leads (pre-filter). Master: ${TOTAL} total."
            git commit -m "scrape: weekly run $(date -u +'%Y-%m-%d') — ${TOTAL} total leads in master"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=1
                break
              fi
              echo "Push attempt $i/3 failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -eq 0 ]; then
              echo "ERROR: all 3 push attempts failed — commit exists locally but was not pushed."
              exit 1
            fi
          fi

      - name: Upload run CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: output/runs/*.csv
          retention-days: 90
