name: Weekly Lead Scrape

on:
  schedule:
    - cron: '0 19 * * 0'   # midnight PKT (UTC+5) every Sunday
  workflow_dispatch:        # manual trigger from GitHub UI anytime

permissions:
  contents: write           # needed to commit CSVs back to repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6h cap — expanded run (106 GM + 47 Clutch + 21 GF + 16 Sortlist + 26 DR + 35 GH + 8 TD + 12 TechBehemoths + 13 SelectedFirms + Eventbrite + PSEB)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        run: npx playwright install chromium --with-deps

      - name: Install Python deps (ScrapegraphAI)
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai --quiet

      - name: Install Python deps (Scrapling)
        run: pip install "scrapling[fetchers]" --quiet && scrapling install

      - name: Run unit tests
        run: npm test

      - name: Verify shared taxonomy/regions data is in sync with the dashboard
        run: npm run sync-shared-data:check

      - name: Run scraper
        run: node src/index.js
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}

      - name: Commit updated lead files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No new leads — nothing to commit."
          else
            TOTAL=$(wc -l < output/leads-master.csv || echo "?")
            RUN_CSV=$(ls -t output/runs/*.csv 2>/dev/null | head -1)
            RUN_TOTAL=$([ -n "$RUN_CSV" ] && wc -l < "$RUN_CSV" || echo "?")
            echo "Run scraped: ${RUN_TOTAL} leads (pre-filter). Master: ${TOTAL} total."
            git commit -m "scrape: weekly run $(date -u +'%Y-%m-%d') — ${TOTAL} total leads in master"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=1
                break
              fi
              echo "Push attempt $i/3 failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -eq 0 ]; then
              echo "ERROR: all 3 push attempts failed — commit exists locally but was not pushed."
              exit 1
            fi
          fi

      - name: Upload run CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: output/runs/*.csv
          retention-days: 90
