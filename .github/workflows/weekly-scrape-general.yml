name: Weekly Lead Scrape (General / Local Business)

# Separate from weekly-scrape.yml (the tech-vertical run) specifically because
# that run is already at the ~360-minute practical ceiling for a single job —
# adding ~160 more Playwright-driven Google Maps queries plus the OSM
# healthcare/general verticals to the same run risked timing it out. This runs
# on its own day/budget instead. Doesn't need the Scrapling/cloak-browser
# install steps weekly-scrape.yml has — googleMapsGeneral and openStreetMap
# don't touch the anti-bot-protected directory sites those exist for.

on:
  schedule:
    - cron: '0 19 * * 3'   # midnight PKT (UTC+5) every Wednesday — offset from the Sunday tech run
  workflow_dispatch:        # manual trigger from GitHub UI anytime

permissions:
  contents: write           # needed to commit CSVs back to repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240    # ~161 GM general queries + ~26 OSM jobs (Overpass is fast) — well under weekly-scrape.yml's 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        run: npx playwright install chromium --with-deps

      - name: Install Python deps (ScrapegraphAI — email enrichment rung 2)
        # This workflow previously installed only MarkItDown, so even after the
        # LLM keys were added to its env the enrichment rung could not run:
        # scrapegraph_enricher.py imports scrapegraphai and cleanly no-ops when
        # it's absent, which made the gap silent. langchain-openai is what backs
        # the OpenRouter entry (ScrapegraphAI rejects an "openrouter/..." model
        # string and needs a ChatOpenAI model_instance instead).
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai langchain-openai --quiet

      - name: Install Python deps (MarkItDown — web-tagging fallback rung)
        run: pip install "markitdown[all]" --quiet

      - name: Install Python deps (Overture Maps — bbox-pruned Places source)
        run: pip install overturemaps duckdb --quiet

      - name: Compute ISO week for cache key
        id: week
        run: echo "value=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Overture bbox cache
        # Keyed by ISO week so a re-run within the same week reuses the ~250MB
        # per-country download instead of re-fetching it; config.overture's
        # own cacheMaxAgeDays (30d) is the real freshness control — this key
        # just avoids re-downloading unchanged data inside one calendar week.
        uses: actions/cache@v4
        with:
          path: output/cache
          key: overture-bbox-${{ steps.week.outputs.value }}
        id: overture-cache

      - name: Install curl-impersonate (TLS-fingerprint fallback for emailFinder)
        # Best-effort: never fails the job. See weekly-scrape.yml for the full
        # explanation — same step, kept identical across workflows.
        continue-on-error: true
        run: |
          ASSET_URL=$(curl -sL https://api.github.com/repos/lwthiker/curl-impersonate/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*x86_64-linux-gnu\.tar\.gz"' \
            | grep -v 'lib' | head -1 | cut -d'"' -f4)
          echo "Resolved asset: ${ASSET_URL:-<none found>}"
          curl -sL "$ASSET_URL" -o curl-impersonate.tar.gz \
            && mkdir -p curl-impersonate && tar -xzf curl-impersonate.tar.gz -C curl-impersonate \
            && sudo cp curl-impersonate/curl_chrome* /usr/local/bin/curl_chrome116 \
            && sudo chmod +x /usr/local/bin/curl_chrome116 \
            && curl_chrome116 --version || echo "curl-impersonate install skipped/failed — fallback stays disabled, no impact on the run"

      - name: Run unit tests
        run: npm test

      - name: Verify shared taxonomy/regions data is in sync with the dashboard
        run: npm run sync-shared-data:check

      - name: Run scraper (general/local-business sources only)
        run: node src/index.js --only=googleMapsGeneral,openStreetMap,overture,youtube
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This workflow was passing FIRECRAWL_API_KEY but none of the LLM
          # enrichment keys, so rung 2 (scrapegraph_enricher.py) silently
          # no-opped for exactly the general local-business verticals that need
          # email enrichment most — their leads carry a phone but rarely an
          # email. Brought to parity with weekly-scrape.yml here.
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Export the complete, guaranteed-up-to-date leads database
        run: npm run export-all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updated lead files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No new leads — nothing to commit."
          else
            TOTAL=$(wc -l < output/leads-master.csv || echo "?")
            RUN_CSV=$(ls -t output/runs/*.csv 2>/dev/null | head -1)
            RUN_TOTAL=$([ -n "$RUN_CSV" ] && wc -l < "$RUN_CSV" || echo "?")
            echo "Run scraped: ${RUN_TOTAL} leads (pre-filter). Master: ${TOTAL} total."
            git commit -m "scrape: weekly general-vertical run $(date -u +'%Y-%m-%d') — ${TOTAL} total leads in master"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=1
                break
              fi
              echo "Push attempt $i/3 failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -eq 0 ]; then
              echo "ERROR: all 3 push attempts failed — commit exists locally but was not pushed."
              exit 1
            fi
          fi

      - name: Upload run CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-general-${{ github.run_id }}
          path: output/runs/*.csv
          retention-days: 90
