name: Weekly Lead Scrape (General / Local Business)

# Separate from weekly-scrape.yml (the tech-vertical run) specifically because
# that run is already at the ~360-minute practical ceiling for a single job —
# adding ~160 more Playwright-driven Google Maps queries plus the OSM
# healthcare/general verticals to the same run risked timing it out. This runs
# on its own day/budget instead. Doesn't need the Scrapling/cloak-browser
# install steps weekly-scrape.yml has — googleMapsGeneral and openStreetMap
# don't touch the anti-bot-protected directory sites those exist for.

on:
  schedule:
    - cron: '0 19 * * 3'   # midnight PKT (UTC+5) every Wednesday — offset from the Sunday tech run
  workflow_dispatch:        # manual trigger from GitHub UI anytime

permissions:
  contents: write           # needed to commit CSVs back to repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240    # ~161 GM general queries + ~26 OSM jobs (Overpass is fast) — well under weekly-scrape.yml's 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Verify shared taxonomy/regions data is in sync with the dashboard
        run: npm run sync-shared-data:check

      - name: Run scraper (general/local-business sources only)
        run: node src/index.js --only=googleMapsGeneral,openStreetMap
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export the complete, guaranteed-up-to-date leads database
        run: npm run export-all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updated lead files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No new leads — nothing to commit."
          else
            TOTAL=$(wc -l < output/leads-master.csv || echo "?")
            RUN_CSV=$(ls -t output/runs/*.csv 2>/dev/null | head -1)
            RUN_TOTAL=$([ -n "$RUN_CSV" ] && wc -l < "$RUN_CSV" || echo "?")
            echo "Run scraped: ${RUN_TOTAL} leads (pre-filter). Master: ${TOTAL} total."
            git commit -m "scrape: weekly general-vertical run $(date -u +'%Y-%m-%d') — ${TOTAL} total leads in master"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=1
                break
              fi
              echo "Push attempt $i/3 failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -eq 0 ]; then
              echo "ERROR: all 3 push attempts failed — commit exists locally but was not pushed."
              exit 1
            fi
          fi

      - name: Upload run CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-general-${{ github.run_id }}
          path: output/runs/*.csv
          retention-days: 90
