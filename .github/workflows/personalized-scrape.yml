name: Personalized Lead Runs

on:
  schedule:
    # Was daily; switched to weekly at the user's explicit request. Real
    # consequence, not just a CI cadence tweak: runSavedSearches.js's
    # DUE_AFTER_MS lets a user pick 'daily' or 'weekly' refresh per saved
    # search, but a search can never actually run more often than THIS
    # workflow fires. A 'daily' search now effectively gets weekly service —
    # flagged to the user before this change, confirmed anyway. Monday, the
    # day after weekly-scrape.yml's Sunday tech run, so freshly scraped leads
    # are available for personalized matching right away.
    - cron: '0 2 * * 1'     # 07:00 PKT every Monday
  workflow_dispatch:         # also fired by the dashboard's "Run now" button via the GitHub API

# Unlike the weekly scrape this writes nothing back to the repo — personalized
# results live in Supabase (user_leads), so no contents: write needed.
permissions:
  contents: read

# Never run two workers at once: they'd both claim the same pending rows.
concurrency:
  group: personalized-scrape
  cancel-in-progress: false

jobs:
  personalized:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # far below the weekly run's 360 — these are per-user quick scans

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        # This exact step hung the ENTIRE 90-minute job budget on 2026-08-19:
        # apt-get stalled fetching an Ubuntu package index, zero forward
        # progress, no error — because there was no per-attempt timeout to
        # fail it and retry. `timeout 300` bounds each attempt so a stuck
        # mirror gets retried instead of silently eating the whole job; the
        # step-level timeout-minutes is the outer backstop. See
        # weekly-scrape.yml's identical step for the same fix.
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium --with-deps && break
            echo "Playwright/Chromium install attempt $i/3 failed or hung, retrying in 15s..."
            sleep 15
          done

      - name: Install Python deps (ScrapegraphAI)
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai langchain-openai --quiet

      - name: Install Python deps (Scrapling)
        run: pip install "scrapling[fetchers]" --quiet && scrapling install

      - name: Install Python deps (MarkItDown — web-tagging fallback rung)
        run: pip install "markitdown[all]" --quiet

      - name: Install curl-impersonate (TLS-fingerprint fallback for emailFinder)
        # Best-effort: never fails the job. See weekly-scrape.yml for the full
        # explanation — same step, kept identical across workflows.
        continue-on-error: true
        run: |
          ASSET_URL=$(curl -sL https://api.github.com/repos/lwthiker/curl-impersonate/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*x86_64-linux-gnu\.tar\.gz"' \
            | grep -v 'lib' | head -1 | cut -d'"' -f4)
          echo "Resolved asset: ${ASSET_URL:-<none found>}"
          curl -sL "$ASSET_URL" -o curl-impersonate.tar.gz \
            && mkdir -p curl-impersonate && tar -xzf curl-impersonate.tar.gz -C curl-impersonate \
            && sudo cp curl-impersonate/curl_chrome* /usr/local/bin/curl_chrome116 \
            && sudo chmod +x /usr/local/bin/curl_chrome116 \
            && curl_chrome116 --version || echo "curl-impersonate install skipped/failed — fallback stays disabled, no impact on the run"

      - name: Run unit tests
        run: npm test

      - name: Verify shared taxonomy/regions data is in sync with the dashboard
        run: npm run sync-shared-data:check

      - name: Run personalized scrapes
        run: node src/index.js saved-searches
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
