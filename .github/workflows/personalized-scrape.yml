name: Personalized Lead Runs

on:
  schedule:
    - cron: '0 2 * * *'     # 07:00 PKT daily — picks up 'daily'/'weekly' saved searches
  workflow_dispatch:         # also fired by the dashboard's "Run now" button via the GitHub API

# Unlike the weekly scrape this writes nothing back to the repo — personalized
# results live in Supabase (user_leads), so no contents: write needed.
permissions:
  contents: read

# Never run two workers at once: they'd both claim the same pending rows.
concurrency:
  group: personalized-scrape
  cancel-in-progress: false

jobs:
  personalized:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # far below the weekly run's 360 — these are per-user quick scans

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium system deps
        run: npx playwright install chromium --with-deps

      - name: Install Python deps (ScrapegraphAI)
        run: pip install "scrapegraphai>=1.0" langchain-groq langchain-mistralai --quiet

      - name: Run unit tests
        run: npm test

      - name: Run personalized scrapes
        run: node src/index.js saved-searches
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          MISTRAL_KEY_1: ${{ secrets.MISTRAL_KEY_1 }}
          MISTRAL_KEY_2: ${{ secrets.MISTRAL_KEY_2 }}
          MISTRAL_KEY_3: ${{ secrets.MISTRAL_KEY_3 }}
